name: Build Extension

on:
    push:
        tags:
            - "v*"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y jq zip
                  npm install -g crx3

            - name: Read version from Chrome manifest
              id: manifest
              run: |
                  VERSION=$(jq -r .version manifest.json)
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            # -------------------------
            # Chrome / Edge build
            # -------------------------

            - name: Build Chrome CRX
              run: |
                  echo "${{ secrets.CHROME_EXTENSION_KEY }}" > key.pem
                  crx3 package . --key key.pem --out extension-chrome.crx

            - name: Build Edge CRX
              run: |
                  cp extension-chrome.crx extension-edge.crx

            # -------------------------
            # Firefox build
            # -------------------------

            - name: Prepare Firefox manifest
              run: |
                  cp manifest.json manifest_chrome.json
                  cp manifest_firefox.json manifest.json

            - name: Build Firefox XPI
              run: |
                  zip -r extension-firefox.xpi . \
                  -x "*.git*" "*.github*" "node_modules/*"

            - name: Restore Chrome manifest
              run: |
                  cp manifest.json manifest_firefox.json
                  cp manifest_chrome.json manifest.json

            # -------------------------
            # Source package
            # -------------------------

            - name: Build source zip
              run: |
                  zip -r extension-source.zip . \
                  -x "*.git*" "*.github*" "node_modules/*"

            # -------------------------
            # Upload release
            # -------------------------

            - name: Upload release assets
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ steps.manifest.outputs.version }}
                  files: |
                      extension-chrome.crx
                      extension-edge.crx
                      extension-firefox.xpi
                      extension-source.zip
