name: Build Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # Checkout repository
      # -------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Install tools
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip rsync openssl
          npm install -g crx3

      # -------------------------------------------------
      # Read extension version
      # -------------------------------------------------
      - name: Read version from manifest
        id: manifest
        run: |
          VERSION=$(jq -r .version manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # =================================================
      # CHROME / EDGE BUILD
      # =================================================

      - name: Prepare Chrome build
        run: |
          mkdir build-chrome

          cp manifest.json build-chrome/

          rsync -av icons build-chrome/
          rsync -av src build-chrome/
          rsync -av dist build-chrome/

      - name: Generate CRX signing key
        run: |
          openssl genrsa -out key.pem 2048

      - name: Build Chrome CRX
        run: |
          crx3 package build-chrome --key key.pem --out extension-chrome.crx

      - name: Build Edge CRX
        run: |
          cp extension-chrome.crx extension-edge.crx

      # =================================================
      # FIREFOX BUILD
      # =================================================

      - name: Prepare Firefox build
        run: |
          mkdir build-firefox

          cp manifest_firefox.json build-firefox/manifest.json

          rsync -av icons build-firefox/
          rsync -av src build-firefox/
          rsync -av dist build-firefox/

      - name: Build Firefox XPI
        run: |
          cd build-firefox
          zip -r ../extension-firefox.xpi .

      # =================================================
      # SOURCE ZIP
      # =================================================

      - name: Build source archive
        run: |
          zip -r extension-source.zip . \
            -x "*.git*" \
               "*.github*" \
               "node_modules/*" \
               "build-*"

      # =================================================
      # CREATE GITHUB RELEASE
      # =================================================

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.manifest.outputs.version }}
          files: |
            extension-chrome.crx
            extension-edge.crx
            extension-firefox.xpi
            extension-source.zip